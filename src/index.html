<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Horas Médicas - Clínica DevOps</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Clínica Salud DevOps - Reserva Online</h1>
        <p class="status">Estado del Servicio: <strong>Operativo y Conectado</strong></p>
        
        <div class="card">
            <h2>Formulario de Reserva de Horas Médicas</h2>
            <form>
                <label for="nombre">Nombre del Paciente:</label>
                <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>

                <label for="especialidad">Especialidad Médica:</label>
                <select id="especialidad">
                    <option value="medicina-general">Medicina General</option>
                    <option value="pediatria">Pediatría</option>
                    <option value="cardiologia">Cardiología</option>
                </select>

                <label for="fecha">Fecha y Hora:</label>
                <input type="datetime-local" id="fecha" required>

                <button type="submit" class="btn">Reservar Hora</button>
            </form>
        </div>
    </div>
</body>
</html>
